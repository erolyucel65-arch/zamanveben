<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: 'var(--bg)', card: 'var(--card)', cream: 'var(--cream)',
          ink: 'var(--ink)', muted: 'var(--muted)', faint: 'var(--faint)',
          espresso: 'var(--espresso)', accent: 'var(--accent)', line: 'var(--line)',
          danger: 'var(--danger)'
        },
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] },
        borderRadius: { '4xl': '1.75rem', '5xl': '2.25rem' },
        boxShadow: {
          soft: '0 1px 2px rgba(74,53,37,0.04), 0 8px 24px -12px rgba(74,53,37,0.12)',
          lift: '0 2px 4px rgba(74,53,37,0.05), 0 18px 40px -18px rgba(74,53,37,0.22)'
        }
      }
    }
  };
</script>
<style>
  :root, [data-theme="light"] {
    --bg: #FDFBF7; --card: #FFFFFF; --cream: #F4EDE2;
    --ink: #2A211B; --muted: #8C8076; --faint: #B7ADA2;
    --espresso: #4A3525; --accent: #F0A227; --line: rgba(74,53,37,0.09);
    --danger: #C0492F; --done-bg: #DCEFD0; --done-edge: #6FB257;
  }
  [data-theme="dark"] {
    --bg: #17120E; --card: #221C16; --cream: #2A231C;
    --ink: #F2EAE0; --muted: #9C9085; --faint: #6E6358;
    --espresso: #C8A079; --accent: #F0A227; --line: rgba(255,247,237,0.08);
    --danger: #E0795F; --done-bg: #324129; --done-edge: #7CC162;
  }
  html, body { background: var(--bg); margin: 0; }
  .safe-top { padding-top: max(1.25rem, env(safe-area-inset-top)); }
  .safe-bottom { padding-bottom: max(4rem, calc(env(safe-area-inset-bottom) + 2rem)); }
  * { -webkit-tap-highlight-color: transparent; }
  body { color: var(--ink); font-family: '"Plus Jakarta Sans"', system-ui, sans-serif; }
  .tnum { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; border: 3px solid transparent; background-clip: padding-box; }
  @media (prefers-reduced-motion: no-preference) {
    .pop { animation: pop .28s cubic-bezier(.34,1.56,.64,1); }
  }
  @keyframes pop { from { transform: scale(.4); } to { transform: scale(1); } }
  @media (prefers-reduced-motion: no-preference) {
    .fade-in { animation: fadeIn .3s ease; }
    .settle { animation: settle .34s cubic-bezier(.22,.61,.36,1); }
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes settle { from { opacity: .4; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .strike { position: relative; }
  .strike > span.txt { transition: color .25s ease; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
