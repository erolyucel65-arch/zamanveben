<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Modeling Process · Course Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
<script>try{var t=JSON.parse(localStorage.getItem('sdb3:theme'));if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>:root{
  --bg:#F2F5F9;--surface:#FFFFFF;--surface2:#E9EFF6;--ink:#0F2340;--ink2:#4A5A70;--line:#D3DCE8;
  --navy:#113B6A;--red:#E4003A;--teal:#0B7F83;--amber:#B97800;--green:#23804E;--violet:#6A4C9C;--ghost:#9AA7B8;
  --bar:#113B6A;--barink:#FFFFFF;--slide:#FFFFFF;--band:rgba(17,59,106,.06);--redsoft:rgba(228,0,58,.08);--navysoft:rgba(17,59,106,.08);
  --shadow:0 1px 2px rgba(15,35,64,.06),0 4px 14px rgba(15,35,64,.06);
  --f:'Roboto',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1628;--surface:#10223A;--surface2:#16304F;--ink:#E6EEF8;--ink2:#A3B3C8;--line:#233B5C;
  --navy:#7DB1F0;--red:#FF4D75;--teal:#3CC6C6;--amber:#F2B632;--green:#4CC38A;--violet:#B39AEA;--ghost:#5F7593;
  --bar:#0C1B30;--barink:#E6EEF8;--slide:#0E1F36;--band:rgba(125,177,240,.07);--redsoft:rgba(255,77,117,.12);--navysoft:rgba(125,177,240,.1);
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0A1628;--surface:#10223A;--surface2:#16304F;--ink:#E6EEF8;--ink2:#A3B3C8;--line:#233B5C;
  --navy:#7DB1F0;--red:#FF4D75;--teal:#3CC6C6;--amber:#F2B632;--green:#4CC38A;--violet:#B39AEA;--ghost:#5F7593;
  --bar:#0C1B30;--barink:#E6EEF8;--slide:#0E1F36;--band:rgba(125,177,240,.07);--redsoft:rgba(255,77,117,.12);--navysoft:rgba(125,177,240,.1);
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;line-height:1.2;font-weight:700;letter-spacing:-.01em}
p{margin:0 0 .6em}
a{color:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.muted{color:var(--ink2)} .small{font-size:12.5px} .red{color:var(--red)} .b{font-weight:700}

/* ---------- üst bar ---------- */
.top{position:sticky;top:0;z-index:50;display:flex;align-items:stretch;gap:18px;background:var(--bar);color:var(--barink);padding:0 16px;padding-top:env(safe-area-inset-top,0px);min-height:62px;box-shadow:0 1px 0 rgba(255,255,255,.06)}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;white-space:nowrap;padding-right:6px}
.brand svg{flex:none}
.brand span{font-size:12px;line-height:1.15;opacity:.85}
.brand b{display:block;font-size:15px;opacity:1;letter-spacing:.01em}
.menu{display:flex;align-items:stretch;gap:0;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.menu::-webkit-scrollbar{display:none}
.grp{display:flex;flex-direction:column;justify-content:center;padding:0 12px;border-left:1px solid rgba(255,255,255,.14)}
.gl{font-size:11px;opacity:.6;letter-spacing:.02em;margin-bottom:1px;white-space:nowrap}
.grp div{display:flex;gap:2px}
.menu a{color:inherit;text-decoration:none;font-size:12.5px;font-weight:500;letter-spacing:.06em;padding:5px 9px 6px;border-radius:4px;opacity:.78;white-space:nowrap;position:relative}
.menu a:hover{opacity:1;background:rgba(255,255,255,.08)}
.menu a.on{opacity:1}
.menu a.on::after{content:"";position:absolute;left:9px;right:9px;bottom:0;height:3px;border-radius:2px;background:#E4003A}
.tools{display:flex;align-items:center;gap:8px}
.tbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:inherit;border-radius:6px;padding:6px 10px;font-size:12px;font-weight:500;letter-spacing:.05em;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.16)}
.stockbtn{display:flex;align-items:center;gap:7px}
.stockbtn .pct{font-size:13px;font-weight:700;letter-spacing:0}
.stockbtn.pulse svg{animation:pulse .9s ease}
@keyframes pulse{40%{transform:scale(1.18)}}

/* ---------- genel sayfa ---------- */
main{max-width:1480px;margin:0 auto;padding:18px 18px 40px}
.page{animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;margin:4px 0 16px}
.phead h1{font-size:26px}
.phead p{max-width:640px;margin:0;color:var(--ink2);text-align:right}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow)}
.card h3{font-size:16px;margin-bottom:10px}
.card h4{font-size:13.5px;margin:12px 0 6px;color:var(--ink2);font-weight:500}
.grid{display:grid;gap:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--bg)}
:root:not([data-theme="dark"]) .btn.pri{color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;user-select:none}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--bg)}
:root:not([data-theme="dark"]) .chip.on{color:#fff}
.chip.hl{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:var(--bg)}
:root:not([data-theme="dark"]) .seg button.on{color:#fff}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs a{padding:9px 14px;text-decoration:none;color:var(--ink2);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--ink);border-color:var(--red)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:4px;padding:1px 6px;background:var(--navysoft);color:var(--navy)}
.pill.r{background:var(--redsoft);color:var(--red)}

/* kontroller */
.ctl{margin:0 0 12px}
.ctl label{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:2px}
.ctl output{font-weight:700;color:var(--navy)}
.ctl input[type=range]{width:100%;accent-color:var(--red)}
.ctl .hint{font-size:11.5px;color:var(--ink2)}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0;cursor:pointer}
.sw input{accent-color:var(--red);width:16px;height:16px}
select.sel{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi .v{font-size:24px;font-weight:700;line-height:1.1}
.kpi .l{font-size:12px;color:var(--ink2)}
.kpi .d{font-size:12px;font-weight:500}
.kpi.alert .v{color:var(--red)}
.insight{border-left:3px solid var(--red);background:var(--redsoft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px}
.insight p:last-child{margin:0}

/* grafik */
.chartbox{position:relative;width:100%}
svg.chart{display:block;overflow:visible;font-family:var(--f)}
svg.chart text{fill:var(--ink2);font-size:11px}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .axis{stroke:var(--ink2);stroke-width:1}
svg.chart .line{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
svg.chart .line.ghost{stroke-width:1.6;opacity:.55}
svg.chart .area{opacity:.12;stroke:none}
svg.chart .band{fill:var(--band)}
svg.chart .hline{stroke:var(--ghost);stroke-dasharray:4 4}
svg.chart .vmark{stroke:var(--ink2);stroke-dasharray:3 3}
svg.chart .cross{stroke:var(--ink2);stroke-width:1}
svg.chart .ov{fill:transparent;cursor:crosshair}
svg.chart .endlab{font-size:11.5px;font-weight:700}
svg.chart .mlab{font-size:11px;font-weight:500}
svg.chart .ptlab{font-size:11px;font-weight:700}
.ctitle{font-size:13.5px;font-weight:700;margin:2px 0 4px}
.csub{font-size:12px;color:var(--ink2);margin:-2px 0 6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2);margin-top:4px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.tip{position:fixed;z-index:200;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:140px;max-width:280px}
.tip .th{font-weight:700;margin-bottom:4px}
.tip .tr{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip .tr span:first-child{display:flex;align-items:center;gap:6px}
.tip i{width:10px;height:3px;border-radius:2px;display:inline-block}

/* ---------- sunum ---------- */
.deck{display:flex;flex-direction:column;height:calc(100vh - 62px - 36px);min-height:420px}
.stagewrap{flex:1;position:relative;min-height:0;overflow:hidden}
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--slide);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.sl{position:absolute;inset:0;padding:34px 52px 40px;display:flex;flex-direction:column}
.sl.anim{animation:fade .3s ease}
.slidehead{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,40%);gap:28px;align-items:end;border-bottom:2px solid var(--line);padding-bottom:12px;margin-bottom:18px}
.slidehead h2{font-size:33px;color:var(--navy)}
.slidehead p{margin:0;text-align:right;color:var(--ink2);font-size:15.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slbody{flex:1;min-height:0;display:grid;gap:22px}
.g2{grid-template-columns:1fr 1fr}.g21{grid-template-columns:1.45fr 1fr}.g12{grid-template-columns:1fr 1.45fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.slfoot{position:absolute;left:52px;right:52px;bottom:12px;display:flex;justify-content:space-between;font-size:12px;color:var(--ink2)}
.sl .card{box-shadow:none}
.sl h3{font-size:18px;margin-bottom:8px}
.big{font-size:17px;line-height:1.5}
.lst{margin:0;padding-left:1.1em}.lst li{margin:0 0 .45em}
.deckbar{display:flex;align-items:center;gap:8px;padding:6px 2px 0;font-size:13px}
.deckbar .prog{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.deckbar .prog i{display:block;height:100%;background:var(--red);transition:width .25s}
.deckbar .cnt{min-width:64px;text-align:center;font-weight:700}
.notes{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:3px solid var(--red);padding:12px 20px 16px;max-height:34vh;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.notes h4{font-size:12.5px;color:var(--ink2);margin-bottom:4px;font-weight:500}
.laser{position:fixed;z-index:300;width:16px;height:16px;border-radius:50%;background:#E4003A;box-shadow:0 0 14px 4px rgba(228,0,58,.55);pointer-events:none;transform:translate(-50%,-50%)}
.cover{display:grid;grid-template-columns:1.25fr 1fr;height:100%;gap:30px;align-items:center}
.cover h1{font-size:50px;line-height:1.05;color:var(--navy);letter-spacing:-.02em;margin-bottom:14px}
.cover .sub{font-size:20px;color:var(--ink2);max-width:560px}
.bignum .cap{font-size:21px;font-weight:500;line-height:1.3;max-width:420px}
.bignum .n{font-size:168px;font-weight:900;line-height:.9;color:var(--red);letter-spacing:-.04em}
.prep{position:absolute;left:56px;right:56px;bottom:24px;text-align:center;font-size:14px;color:var(--ink2)}
.prep [contenteditable]{border-bottom:1px dashed var(--ghost);padding:0 4px;min-width:120px;display:inline-block}
.poll{display:grid;gap:8px}
.pollrow{display:grid;grid-template-columns:1fr 150px 40px auto;gap:10px;align-items:center}
.pollrow .bar{height:22px;background:var(--surface2);border-radius:4px;overflow:hidden}
.pollrow .bar i{display:block;height:100%;background:var(--navy);transition:width .3s}
.pollrow .cn{font-weight:700;text-align:right}
.pm{display:flex;gap:4px}.pm button{width:28px;height:26px;border:1px solid var(--line);background:var(--surface);border-radius:5px;font-weight:700}
.reveal{border:1px dashed var(--ghost);border-radius:8px;padding:12px 14px}
.flip{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);cursor:pointer;min-height:150px;display:flex;flex-direction:column;gap:8px}
.flip .q{font-size:17px;font-weight:700}
.flip .a{display:none;font-size:15px;border-top:1px solid var(--line);padding-top:8px}
.flip.open .a{display:block}
.flip .k{font-size:12px;color:var(--ink2)}
.tl{position:relative;display:flex;justify-content:space-between;gap:6px;margin:30px 0 10px;padding-top:26px}
.tl::before{content:"";position:absolute;left:0;right:0;top:34px;height:3px;background:var(--line)}
.tl button{position:relative;border:0;background:none;padding:0;text-align:center;flex:1;font-size:13px;color:var(--ink2)}
.tl button b{display:block;width:18px;height:18px;margin:0 auto 8px;border-radius:50%;background:var(--surface);border:3px solid var(--navy)}
.tl button.on b{background:var(--red);border-color:var(--red)}
.tl button.on{color:var(--ink);font-weight:700}
.tl .yr{font-size:15px;font-weight:700;color:var(--ink)}

/* ilkeler */
.ring text{font-size:12px}
.pcols{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pcol h3{font-size:14px;color:var(--ink2);font-weight:500;margin:0 0 8px;display:flex;justify-content:space-between}
.pcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;transition:border-color .15s}
.pcard:hover{border-color:var(--navy)}
.pcard .no{font-size:12px;font-weight:700;color:var(--red)}
.pcard .t{font-weight:700;font-size:14.5px;line-height:1.3;display:block;margin:2px 0}
.pcard .o{font-size:12.5px;color:var(--ink2);line-height:1.35}
.pcard.dim{opacity:.35}
.pcard.sel{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
.pcard.seen .no::after{content:" ✓";color:var(--green)}
.pdet h2{font-size:23px;color:var(--navy);margin:2px 0 4px}
.pdet .en{font-style:italic;color:var(--ink2);font-size:13px;margin-bottom:10px}
.pdet section{margin-top:12px}
.pdet h4{font-size:12.5px;color:var(--ink2);margin-bottom:3px;font-weight:500}
.matrix{border-collapse:collapse;width:100%;font-size:13px}
.matrix th,.matrix td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.dotf{color:var(--red);font-size:16px}

/* laboratuvar */
.lab{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.lab .side{position:sticky;top:76px}
.eqs{font-size:12.5px;background:var(--surface2);border-radius:8px;padding:10px 12px;overflow:auto;line-height:1.6}
.eqs code{font-family:inherit;font-weight:500}
.meter{height:14px;background:var(--surface2);border-radius:7px;overflow:hidden;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--navy),var(--red));transition:width .5s}
.test{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface)}
.test.done{border-color:var(--green)}
.test h3 .st{float:right;font-size:12px;font-weight:500;color:var(--ink2)}
.test.done h3 .st{color:var(--green)}
.eqopt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13.5px}
.eqopt.ok{border-color:var(--green);background:rgba(35,128,78,.08)}
.eqopt.no{border-color:var(--red);background:var(--redsoft)}

/* oyun */
.game{display:grid;grid-template-columns:290px minmax(0,1fr) 260px;gap:16px;align-items:start}
.gauge{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding:7px 0}
.gauge b{font-size:20px}
.log{max-height:360px;overflow:auto;font-size:13px}
.log div{padding:7px 0;border-bottom:1px solid var(--line)}
.evt{border:2px solid var(--red);border-radius:10px;padding:12px;background:var(--redsoft);margin-bottom:12px}
.evt p{margin:4px 0 8px}
.brief{font-size:14.5px}

/* atölye */
.qrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.drawbox svg{touch-action:none;cursor:crosshair;user-select:none}
.bcols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bcol{border:2px dashed var(--line);border-radius:10px;padding:10px;min-height:160px;background:var(--surface)}
.bcol.tgt{border-color:var(--red)}
.bcol h4{margin:0 0 8px;font-size:14px}
.pool{min-height:60px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface2);margin-bottom:12px}
.item{display:inline-block;margin:3px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:grab;user-select:none}
.item.sel{border-color:var(--red);box-shadow:0 0 0 2px var(--redsoft)}
.item.ok{border-color:var(--green);background:rgba(35,128,78,.1)}
.item.no{border-color:var(--red);background:var(--redsoft)}
.item.part{border-color:var(--amber)}
.cld text{font-size:13px;font-weight:500}
.cld .node rect{fill:var(--surface);stroke:var(--line)}
.cld .lnk{fill:none;stroke:var(--ink2);stroke-width:1.8}
.cld .pol circle{fill:var(--surface);stroke:var(--navy);stroke-width:1.5;cursor:pointer}
.cld .pol text{font-size:14px;font-weight:700;pointer-events:none}
.cld .pol.bad circle{stroke:var(--red);stroke-width:3}
.cld .pol.good circle{stroke:var(--green);stroke-width:3}
.cld .lp text{font-weight:700}

/* sınav */
.quiz{max-width:860px;margin:0 auto}
.qopt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 14px;margin:8px 0;font-size:15px}
.qopt:hover:not(:disabled){border-color:var(--navy)}
.qopt.ok{border-color:var(--green);background:rgba(35,128,78,.1)}
.qopt.no{border-color:var(--red);background:var(--redsoft)}
.qdots{display:flex;gap:5px;margin:8px 0 14px}
.qdots i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.qdots i.ok{background:var(--green)}.qdots i.no{background:var(--red)}.qdots i.cur{background:var(--navy)}

/* ders notu (belge) */
.doctool{display:flex;gap:10px;align-items:center;justify-content:space-between;max-width:900px;margin:0 auto 12px}
.doc{background:#fff;color:#1A2332;max-width:900px;margin:0 auto;padding:64px 72px;box-shadow:0 2px 18px rgba(0,0,0,.14);border-radius:2px;font-size:14.5px;line-height:1.6}
.doc h1{font-size:26px;color:#113B6A;margin-bottom:6px}
.doc h2{font-size:18px;color:#113B6A;margin:26px 0 8px;border-bottom:1px solid #D3DCE8;padding-bottom:4px}
.doc h3{font-size:15px;margin:16px 0 6px}
.doc .meta{color:#4A5A70;font-size:13px;margin-bottom:18px}
.doc table{border-collapse:collapse;width:100%;font-size:12.8px;margin:6px 0 4px}
.doc th{background:#E9EFF6;text-align:left}
.doc th,.doc td{border:1px solid #D3DCE8;padding:5px 7px;vertical-align:top}
.doc .cap{font-size:12.5px;color:#4A5A70;margin:4px 0 14px}
.doc .fig{break-inside:avoid;margin:10px 0}
.doc svg.chart text{fill:#4A5A70}
.doc svg.chart .grid{stroke:#D3DCE8}
.doc .note{background:#F2F5F9;border-left:3px solid #E4003A;padding:8px 12px;margin:10px 0}
.doc ol,.doc ul{padding-left:1.3em}
.doc .ref{font-size:12.8px;padding-left:1.6em;text-indent:-1.6em;margin:0 0 5px}

/* modal, toast, popover */
.modal{position:fixed;inset:0;z-index:150;background:rgba(8,18,34,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--surface);border-radius:12px;max-width:760px;width:100%;max-height:86vh;overflow:auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .x{float:right;border:0;background:none;font-size:22px;line-height:1;color:var(--ink2)}
.toast{position:fixed;right:18px;bottom:18px;z-index:210;background:var(--navy);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fade .25s}
:root:not([data-theme="dark"]) .toast{color:#fff}
.pop{position:fixed;z-index:120;top:66px;right:14px;width:330px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.pop li{list-style:none;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:8px}
.pop ul{margin:6px 0 10px;padding:0}
.pop .ck{width:16px;flex:none;color:var(--green);font-weight:700}
.ovgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ovgrid button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:13px}
.ovgrid button.on{border-color:var(--red)}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 6px;font-size:12px;margin-right:6px;min-width:22px;text-align:center}

/* ---------- duyarlı ---------- */
@media (max-width:1100px){.game{grid-template-columns:1fr}.pcols{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){
  .lab{grid-template-columns:1fr}.lab .side{position:static}
  .brand span{display:none}.gl{display:none}.grp{padding:0 4px}
  .phead p{text-align:left}
  .tbtn .lbl{display:none}
  .bcols{grid-template-columns:1fr}
}
@media (max-width:560px){.pcols{grid-template-columns:1fr}.kpi .v{font-size:20px}.doc{padding:28px 20px}}
.stage.fluid{position:relative;width:100%;height:auto;transform:none!important;border-radius:8px}
.stage.fluid .sl{position:relative;inset:auto;padding:18px 16px 36px;min-height:0}
.stage.fluid .slidehead{grid-template-columns:1fr;gap:6px}
.stage.fluid .slidehead h2{font-size:24px}
.stage.fluid .slidehead p{text-align:left}
.stage.fluid .g2,.stage.fluid .g21,.stage.fluid .g12,.stage.fluid .g3,.stage.fluid .g4,.stage.fluid .cover{grid-template-columns:1fr}
.stage.fluid .cover h1{font-size:32px}.stage.fluid .bignum .n{font-size:96px}
.stage.fluid .prep{position:static;margin-top:16px}
.stage.fluid .slfoot{position:static;margin-top:10px}
.deck.fluidd{height:auto}.deck.fluidd .stagewrap{overflow:visible}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- yazdırma ---------- */
@media print{
  .top,.doctool,.toast,.pop,.tip,.notes{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .page{display:none!important}
  #p-notlar{display:block!important}
  .doc{box-shadow:none;padding:0;max-width:none}
  .doc .fig,.doc tr{break-inside:avoid}
  .doc thead{display:table-header-group}
  .doc h2{break-after:avoid}
}

<script>/* ===== DİL / LANGUAGE (EN kaynak, TR çeviri) =====
   Kaynak dil İngilizcedir: koddaki her görünen metin $t('English') içinde yazılır.
   Türkçe karşılıklar i18n-tr.js içindeki I18N_TR sözlüğündedir; içerik verisi content*.en.js / content*.tr.js çiftlerindedir.
   Dil düğmesi seçimi depoya yazar ve sayfayı yeniden yükler. */
const APP_ID = 'sdb3';
const DEFAULT_LANG = 'en';
const LANG = (() => { try { const v = JSON.parse(localStorage.getItem(APP_ID + ':lang')); if (v === 'en' || v === 'tr') return v; } catch (e) { } return DEFAULT_LANG; })();
const LOC = LANG === 'tr' ? 'tr-TR' : 'en-US';
document.documentElement.lang = LANG;
function $t(s, v) {
  let r = s;
  if (LANG === 'tr') { const x = I18N_TR[s]; if (x != null) r = x; else (window.__i18nMissing || (window.__i18nMissing = new Set())).add(s); }
  return v ? r.replace(/\{(\w+)\}/g, (m, k) => (v[k] != null ? v[k] : m)) : r;
}
// Çoğul: $tn(n, 'one form with {n}', 'many form with {n}', {…}) → n === 1 ise ilk kalıp; her iki kalıp da sözlükte olmalı.
function $tn(n, one, many, v) { return $t(n === 1 ? one : many, Object.assign({ n: n }, v)); }
function setLang(l) { try { localStorage.setItem(APP_ID + ':lang', JSON.stringify(l)); } catch (e) { } location.reload(); }
function applyStaticI18n() {
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = $t(el.getAttribute('data-t')); });
  document.querySelectorAll('[data-t-title]').forEach(el => el.setAttribute('title', $t(el.getAttribute('data-t-title'))));
  document.querySelectorAll('[data-t-aria]').forEach(el => el.setAttribute('aria-label', $t(el.getAttribute('data-t-aria'))));
  const b = document.getElementById('langBtn');
  if (b) { b.querySelectorAll('[data-l]').forEach(x => x.classList.toggle('on', x.getAttribute('data-l') === LANG)); b.onclick = () => setLang(LANG === 'tr' ? 'en' : 'tr'); }
}

 "Workshop: boundary chart and loops": "Atölye: sınır tablosu ve döngüler",
 "In class, {n} people agreed with this statement; you are not alone. ": "Sınıfta bu ifadeye {n} kişi katıldı; yalnız değilsiniz. ",
 "Your choice, {term} {c}, matters too, but the one that directly contradicts this statement is {term} {a} · {title}. ": "Seçtiğiniz {term} {c} de önemli, ama bu ifadeyle doğrudan çelişen {term} {a} · {title}. ",
 "Pilots and designers": "Pilotlar ve tasarımcılar",
 "Ask Forrester’s question before revealing: who matters most for the safe operation of an aircraft? Most students say the pilots. Then open the two-roles tab and ask which role the managers they know spend their time in. Close with Roberts’s warning: evidence and optimization do not automatically change organizations.": "Cevabı açmadan Forrester’ın sorusunu sorun: bir uçağın güvenli çalışmasında en önemli kişi kimdir? Çoğu öğrenci pilotları söyler. Sonra iki rol sekmesini açın ve tanıdıkları yöneticilerin zamanlarını hangi rolde geçirdiğini sorun. Roberts’ın uyarısıyla kapatın: kanıt ve optimizasyon organizasyonları kendiliğinden değiştirmez.",
 "The purpose of modeling: managers as organization designers": "Modellemenin amacı: yöneticiler organizasyon tasarımcısı olarak",
 "Managers are pilots and designers; the design role matters most and gets the least attention (Sterman, 2000, p. 84).": "Yöneticiler hem pilot hem tasarımcıdır; en önemli olan tasarım rolü en az ilgiyi görür (Sterman, 2000, s. 84).",
 "Forrester’s question": "Forrester’ın sorusu",
 "Who are the most important people in the safe operation of an aircraft?": "Bir uçağın güvenli çalışmasında en önemli kişiler kimlerdir?",
 "The pilots": "Pilotlar",
 "The designers": "Tasarımcılar",
 "Air traffic control": "Hava trafik kontrolü",
 "Most people say this. Skilled pilots are critical, but Forrester’s answer is different.": "Çoğu kişi bunu söyler. Usta pilotlar kritiktir, ama Forrester’ın cevabı farklı.",
 "Correct: the designers make the aircraft stable, robust under extreme conditions and safe to fly even by tired or stressed pilots (p. 84).": "Doğru: tasarımcılar uçağı kararlı, aşırı koşullarda sağlam ve yorgun ya da stresli pilotların bile güvenle uçurabileceği hâle getirir (s. 84).",
 "Important, but not the answer: the designers decide whether ordinary pilots can fly safely.": "Önemli, ama cevap bu değil: sıradan pilotların güvenle uçup uçamayacağına tasarımcılar karar verir.",
 "Today no aircraft is designed without modeling and simulation; organizations whose complexity rivals an aircraft are still designed by trial and error, anecdote and imitation (p. 84).": "Bugün hiçbir uçak modelleme ve simülasyon olmadan tasarlanmıyor; karmaşıklığı uçakla yarışan organizasyonlar ise hâlâ deneme yanılmayla, anekdotla ve taklitle tasarlanıyor (s. 84).",
 "Where the real value lies. ": "Gerçek değer nerede. ",
 "Models that help managers pilot their organizations are useful; the real value comes when models support organizational redesign. Forrester: the solutions to small problems yield small rewards; look for the policies and structures that lead to greater success (p. 84).": "Yöneticilerin organizasyonlarını pilot gibi yönetmesine yardım eden modeller yararlıdır; gerçek değer ise modeller organizasyonun yeniden tasarımını desteklediğinde ortaya çıkar. Forrester: küçük problemlerin çözümleri küçük ödüller getirir; daha büyük başarıya götüren politikaları ve yapıları arayın (s. 84).",
 "Two roles": "İki rol",
 "PILOT": "PİLOT",
 "Makes decisions: whom to hire, what price to set, when to launch the product. Takes control from subordinates. Gets most of the attention.": "Karar verir: kimi işe alacak, hangi fiyatı koyacak, ürünü ne zaman çıkaracak. Kontrolü astlardan alır. İlginin çoğunu toplar.",
 "Design by trial and error, by anecdote, by imitation of others.": "Deneme yanılmayla, anekdotla, başkalarını taklit ederek tasarlamak.",
 "DESIGNER": "TASARIMCI",
 "Shapes the organizational structures, strategies and decision rules that influence how decisions are made. Builds a structure consistent with vision and values that ordinary people can run well (Forrester, 1965).": "Kararların nasıl alındığını etkileyen organizasyon yapılarını, stratejileri ve karar kurallarını biçimlendirir. Vizyon ve değerlerle tutarlı, sıradan insanların iyi yönetebileceği bir yapı kurar (Forrester, 1965).",
 "Design with models and simulation: virtual worlds for the organization.": "Modeller ve simülasyonla tasarlamak: organizasyon için sanal dünyalar.",
 "How the role is usually done: ": "Rol genellikle nasıl yapılır: ",
 "Roberts’s warning": "Roberts’ın uyarısı",
 "Why do models get implemented so rarely?": "Modeller neden bu kadar nadir uygulanır?",
 "Roberts (1977) traces the poor implementation record of managerial models to their origins in wartime operations research: in science, hypothesis, data and analysis lead to proof and new knowledge, so people expected the same processes to lead to change in organizations. They do not. Organizational changes, decisions and policies do not flow automatically from evidence, deductive logic and mathematical optimization (Sterman, p. 83).": "Roberts (1977) yönetim modellerinin zayıf uygulama sicilini savaş dönemi yöneylem araştırmasındaki kökenlerine bağlar: bilimde hipotez, veri ve analiz kanıta ve yeni bilgiye götürür, bu yüzden aynı süreçlerin organizasyonlarda da değişime götürmesi beklendi. Götürmez. Organizasyon değişiklikleri, kararlar ve politikalar kanıttan, tümdengelimden ve matematiksel optimizasyondan kendiliğinden akmaz (Sterman, s. 83).",
 "The remedy is an implementation focus from the very start: the client, the political context and the learning process are part of the modeling process, not an afterthought.": "Çare, en baştan uygulama odağıdır: müşteri, politik bağlam ve öğrenme süreci modelleme sürecinin parçasıdır, sonradan akla gelen bir şey değil.",
 "This is why the chapter treats the client and the modeler’s ethics before the technical steps.": "Bölümün müşteriyi ve modelcinin etiğini teknik adımlardan önce ele almasının nedeni budur.",
 "The client and the modeler": "Müşteri ve modelci",
 "Hospital exercise: five people are involved in a project; ask the class who the client is. Then the dilemma: the client wants a predetermined result. Collect votes for the three options before opening the explanations; the Miro board has an alignment scale and dot voting for this discussion.": "Hastane alıştırması: projede birkaç kişi var; sınıfa müşterinin kim olduğunu sorun. Sonra ikilem: müşteri önceden belirlenmiş bir sonuç istiyor. Açıklamaları açmadan üç seçenek için oy toplayın; Miro panosunda bu tartışma için hizalama ölçeği ve nokta oylama var.",
 "The client is whoever must change for the problem to be solved; modeling is done to help the client (pp. 84–85).": "Müşteri, problemin çözülmesi için değişmesi gereken kişidir; modelleme müşteriye yardım etmek için yapılır (s. 84–85).",
 "Who is the client?": "Müşteri kim?",
 "The planning director, who hired you": "Sizi işe alan planlama müdürü",
 "The CFO, who pays the invoices": "Faturaları ödeyen mali işler müdürü",
 "The quality champion, who promotes the project": "Projeyi savunan kalite öncüsü",
 "The ward nurses, whose discharge decisions drive the queues": "Taburcu kararları kuyrukları belirleyen servis hemşireleri",
 "A hospital wants to shorten its emergency-room queues. Four people are involved. Who is the client?": "Bir hastane acil servis kuyruklarını kısaltmak istiyor. Dört kişi işin içinde. Müşteri kim?",
 "The contact: helpful, but the director will not solve the queues by changing her own behavior.": "Temas kişisi: yardımcı olur, ama müdür kendi davranışını değiştirerek kuyrukları çözmeyecek.",
 "The sponsor: cash helps, but the CFO is not the client.": "Sponsor: para işe yarar, ama mali işler müdürü müşteri değil.",
 "The champion: welcome, but not the client.": "Öncü: hoş geldi, ama müşteri değil.",
 "Correct: the nurses are the people whose behavior must change for the problem to be solved; if they are not at the table, the model has no impact (pp. 84–85).": "Doğru: hemşireler, problemin çözülmesi için davranışı değişmesi gereken kişilerdir; masada değillerse modelin etkisi olmaz (s. 84–85).",
 "Clients are busy. ": "Müşteriler meşguldür. ",
 "They are embroiled in politics, looking out for their careers and interested in action, not in the elegance of your theory. Focus on the problems that keep the clients up at night (p. 85).": "Politikanın içindedirler, kariyerlerini kollarlar ve teorinizin zarafetiyle değil eylemle ilgilenirler. Müşterileri geceleri uyutmayan problemlere odaklanın (s. 85).",
 "The initial contact may only be a gatekeeper; the client group can expand or change as the project proceeds (p. 85).": "İlk temas kişisi yalnızca bir kapı bekçisi olabilir; proje ilerledikçe müşteri grubu genişleyebilir ya da değişebilir (s. 85).",
 "Speak truth to power": "Güce karşı doğruyu söylemek",
 "The client tells you which conclusion the report must support. Your analysis does not support it. Your contract depends on this client. What do you do?": "Müşteri raporun hangi sonucu desteklemesi gerektiğini söylüyor. Analiziniz bunu desteklemiyor. Sözleşmeniz bu müşteriye bağlı. Ne yaparsınız?",
 "Adjust the model until it supports the conclusion": "Sonucu destekleyene kadar modeli ayarlarım",
 "Push back: show the analysis and work with the client to resolve it": "Geri adım atmam: analizi gösterir, müşteriyle birlikte çözerim",
 "Quit if the client’s mind is closed": "Müşterinin zihni kapalıysa ayrılırım",
 "This is the hired gun Sterman warns against: far too many consultants are only too eager to oblige. The model becomes a weapon, not a tool of inquiry (p. 85).": "Sterman’ın uyardığı kiralık silah budur: çok fazla danışman buna seve seve uyar. Model bir sorgulama aracı değil, silah olur (s. 85).",
 "Correct first step: require the client to justify their view with data and consider new viewpoints; push back when asked to generate a predetermined result (p. 85).": "Doğru ilk adım: müşteriden görüşünü veriyle gerekçelendirmesini ve yeni bakış açılarını değerlendirmesini isteyin; önceden belirlenmiş sonuç istendiğinde geri adım atmayın (s. 85).",
 "The last resort, but Sterman means it: if you cannot convince the clients to use modeling honestly, quit and get yourself a better client (p. 85).": "Son çare, ama Sterman ciddi: müşterileri modellemeyi dürüstçe kullanmaya ikna edemiyorsanız ayrılın ve kendinize daha iyi bir müşteri bulun (s. 85).",
 "Not a hired gun, not a yes-man. ": "Ne kiralık silah ne evetçi. ",
 "A good modeling process challenges the clients’ conception of the problem, but does not automatically accede to requests for more detail or for ignoring issues just to keep the clients on board (p. 85).": "İyi bir modelleme süreci müşterilerin problem algısına meydan okur, ama yalnızca müşterileri hoş tutmak için daha çok ayrıntı ekleme ya da bazı konuları görmezden gelme isteklerine otomatik olarak uymaz (s. 85).",
 "Ethical responsibility. ": "Etik sorumluluk. ",
 "Carry out the work with rigor and integrity; be willing to let the process change your mind; tell the clients their most cherished beliefs are wrong if that is what the modeling reveals, even if it means you will be fired (p. 85).": "İşi titizlikle ve dürüstlükle yürütün; sürecin fikrinizi değiştirmesine izin verin; modelleme bunu gösteriyorsa, kovulmak pahasına da olsa müşterilere en değer verdikleri inançlarının yanlış olduğunu söyleyin (s. 85).",
 "The five steps": "Beş adım",
 "Click each step in the ring to show its questions (Table 3-1). Stress the center of Figure 3-1: iteration can occur from any step to any other. In the second tab, place the modeling cycle inside the organization’s learning loops (Figure 3-2). The third tab holds Table 3-1 for reference.": "Halkadaki her adıma tıklayarak sorularını gösterin (Tablo 3-1). Şekil 3-1’in merkezini vurgulayın: yineleme herhangi bir adımdan herhangi bir adıma olabilir. İkinci sekmede modelleme döngüsünü organizasyonun öğrenme döngülerinin içine yerleştirin (Şekil 3-2). Üçüncü sekme Tablo 3-1’i başvuru için tutar.",
 "Modeling is iterative: the five steps": "Modelleme yinelemelidir: beş adım",
 "A disciplined process, yet nobody ever built a model by proceeding in sequence (pp. 86–87).": "Disiplinli bir süreç; yine de hiç kimse sırayla ilerleyerek model kurmamıştır (s. 86–87).",
 "The cycle": "Döngü",
 "Questions to ask": "Sorulacak sorular",
 "The links in the center of Figure 3-1 mean that results of any step can revise any earlier step (p. 87).": "Şekil 3-1’in merkezindeki bağlantılar, herhangi bir adımın sonuçlarının önceki herhangi bir adımı değiştirebileceğini gösterir (s. 87).",
 "Inside the learning loop": "Öğrenme döngüsünün içinde",
 "Modeling embedded in the learning loop": "Öğrenme döngüsüne gömülü modelleme",
 "Modeling cycle": "Modelleme döngüsü",
 "problem → hypothesis → formulation": "problem → hipotez → formülasyon",
 "→ testing → policy": "→ test → politika",
 "data": "veri",
 "mental models": "zihinsel modeller",
 "new rules": "yeni kurallar",
 "Simulation models are informed by our mental models and by information from the real world. Strategies and decision rules can be represented and tested in the virtual world; the experiments feed back to alter mental models and lead to new rules, which are then implemented in the real world (Figure 3-2, p. 88).": "Simülasyon modelleri zihinsel modellerimizden ve gerçek dünyadan gelen bilgiden beslenir. Stratejiler ve karar kuralları sanal dünyada temsil edilip sınanabilir; deneyler geri dönerek zihinsel modelleri değiştirir ve gerçek dünyada uygulanan yeni kurallara götürür (Şekil 3-2, s. 88).",
 "Not a one-shot activity. ": "Tek seferlik bir iş değil. ",
 "Modeling does not yield The Answer; it is a continual cycling between the virtual world of the model and the real world of action (p. 89).": "Modelleme Cevabı vermez; modelin sanal dünyası ile eylemin gerçek dünyası arasında sürekli dönen bir süreçtir (s. 89).",
 "Table 3-1": "Tablo 3-1",
 "Steps of the modeling process (Table 3-1, p. 86)": "Modelleme sürecinin adımları (Tablo 3-1, s. 86)",
 "Problem, not system": "Sistem değil, problem",
 "Start with the map and the territory. Then the two cards: which is a model of a problem, which of a system? Ask the class to classify the four examples before revealing. Close with Mesarovic and the purpose as the logical knife.": "Harita ve araziyle başlayın. Sonra kartlar: hangisi bir problemin, hangisi bir sistemin modeli? Cevabı açmadan sınıftan dört örneği sınıflamasını isteyin. Mesarovic ve mantıksal bıçak olarak amaçla kapatın.",
 "Always model a problem. Never model a system.": "Her zaman bir problemi modelleyin. Asla bir sistemi değil.",
 "The purpose of the model acts as the logical knife that decides what can be ignored (Sterman, 2000, pp. 89–90).": "Modelin amacı, neyin göz ardı edilebileceğine karar veren mantıksal bıçaktır (Sterman, 2000, s. 89–90).",
 "Map and territory": "Harita ve arazi",
 "A model to understand how the business cycle can be stabilized": "İş çevriminin nasıl istikrara kavuşturulabileceğini anlamak için bir model",
 "A model that represents the entire economy": "Bütün ekonomiyi temsil eden bir model",
 "A model to explore policies that slow fossil fuel use": "Fosil yakıt kullanımını yavaşlatan politikaları araştırmak için bir model",
 "A model of the whole company, every department and product": "Bütün şirketin, her departmanın ve ürünün modeli",
 "Problem or system?": "Problem mi, sistem mi?",
 "System": "Sistem",
 "Correct: a specific policy issue; everything else can be left out (p. 89).": "Doğru: belirli bir politika sorusu; geri kalan her şey dışarıda bırakılabilir (s. 89).",
 "No: a limited set of issues, so a model of a problem.": "Hayır: sınırlı bir konu kümesi, yani bir problemin modeli.",
 "No: a model of a whole system can never be completed (p. 89).": "Hayır: bütün bir sistemin modeli hiç tamamlanamaz (s. 89).",
 "Correct: it tries to mirror a whole system; it would be as inscrutable as the system itself.": "Doğru: bütün bir sistemi yansıtmaya çalışır; sistemin kendisi kadar anlaşılmaz olurdu.",
 "The map is not the territory. ": "Harita arazi değildir. ",
 "It is a good thing it is not: a map as detailed as the territory would be of no use, as well as being hard to fold (p. 89).": "İyi ki değil: arazi kadar ayrıntılı bir harita hiçbir işe yaramaz, katlaması da zordur (s. 89).",
 "A comprehensive model could never be completed; if it were, the data could never be compiled; if they were, the assumptions could never be tested; if they were, nobody could understand its behavior, and the clients’ confidence would rest on the modeler’s authority (p. 89).": "Kapsayıcı bir model hiç tamamlanamaz; tamamlansa verisi derlenemez; derlense varsayımları sınanamaz; sınansa davranışını kimse anlayamaz ve müşterilerin güveni modelcinin otoritesine dayanır (s. 89).",
 "The logical knife": "Mantıksal bıçak",
 "Why a clear purpose is the most important ingredient": "Açık bir amaç neden en önemli bileşendir",
 "It lets clients test usefulness: ": "Müşterilerin yararlılığı sınamasını sağlar: ",
 "they can ask questions that reveal whether the model addresses their problem.": "modelin kendi problemlerini ele alıp almadığını ortaya çıkaran sorular sorabilirler.",
 "It cuts: ": "Keser: ",
 "the business cycle model need not include population growth or climate; the climate model can exclude interest rates and inventories (p. 90).": "iş çevrimi modelinin nüfus artışını ya da iklimi içermesi gerekmez; iklim modeli faiz oranlarını ve stokları dışarıda bırakabilir (s. 90).",
 "It defends the boundary: ": "Sınırı savunur: ",
 "without a purpose there is no basis to say “we don’t need to include that” when a team member makes a suggestion (p. 90).": "amaç olmadan, bir ekip üyesi öneri yaptığında “buna gerek yok” demenin dayanağı kalmaz (s. 90).",
 "Mesarovic: ": "Mesarovic: ",
 "No matter how many resources you have, you can envision a model complex enough to render them insufficient (Meadows, Richardson and Bruckmann, 1982, p. 197).": "Ne kadar kaynağınız olursa olsun, onları yetersiz kılacak kadar karmaşık bir model hayal edebilirsiniz (Meadows, Richardson ve Bruckmann, 1982, s. 197).",
 "Even models with well-defined purposes can be too large. The craft of model building is knowing what to cut out (pp. 89–90).": "Amacı iyi tanımlanmış modeller bile fazla büyük olabilir. Model kurma zanaati neyin kesileceğini bilmektir (s. 89–90).",
 "Workshop: classify ten statements →": "Atölye: on ifadeyi sınıflayın →",
 "Reference modes and horizon": "Referans modları ve ufuk",
 "Switch between the three horizons. Over 10 years ask “is there a problem?”; most say no. Over 130 years the 1970 peak and the growth of imports appear. Then 151,000 years: the fossil fuel era as a spike, too long to guide policy. The chart is schematic, drawn from the values in the book; it is not the original data.": "Üç ufuk arasında geçiş yapın. 10 yılda “problem var mı?” diye sorun; çoğu hayır der. 130 yılda 1970 zirvesi ve ithalatın büyümesi görünür. Sonra 151.000 yıl: fosil yakıt çağı bir sivri uç olarak, politikaya yön veremeyecek kadar uzun. Grafik şematiktir, kitaptaki değerlerden çizilmiştir; özgün veri değildir.",
 "Reference modes and the time horizon: US oil": "Referans modları ve zaman ufku: ABD petrolü",
 "The choice of time horizon dramatically influences your perception of the problem (Sterman, 2000, pp. 90–94).": "Zaman ufku seçimi problem algınızı çarpıcı biçimde etkiler (Sterman, 2000, s. 90–94).",
 "Reference mode": "Referans modu",
 "A set of graphs and descriptive data showing how the problem developed over time; you refer back to it throughout the process. It helps you and the clients break out of the event-oriented worldview (p. 90).": "Problemin zaman içinde nasıl geliştiğini gösteren grafikler ve betimleyici veriler; süreç boyunca ona geri dönersiniz. Sizin ve müşterilerin olay odaklı bakıştan kurtulmanıza yardım eder (s. 90).",
 "Rule of thumb. ": "Pratik kural. ",
 "Extend far enough back to show how the problem emerged, and far enough ahead to capture the delayed effects of policies: several times the longest delay in the system, and then some (pp. 90, 94).": "Problemin nasıl doğduğunu gösterecek kadar geriye, politikaların gecikmeli etkilerini yakalayacak kadar ileriye uzatın: sistemdeki en uzun gecikmenin birkaç katı, hatta biraz daha fazlası (s. 90, 94).",
 "Hubbert’s forecast": "Hubbert’in öngörüsü",
 "Move the slider: with 150–200 billion barrels, the peak falls in 1966–1972, as Hubbert forecast; with the USGS resource, nearly three times as large, the peak shifts to the late 1980s. The point is structure, not data: Hubbert modeled oil as a nonrenewable resource. The curve is a stylized logistic, not Hubbert’s own.": "Sürgüyü oynatın: 150–200 milyar varille zirve, Hubbert’in öngördüğü gibi 1966–1972’ye düşer; neredeyse üç kat büyük USGS kaynağıyla zirve 1980’lerin sonuna kayar. Mesele veri değil yapıdır: Hubbert petrolü yenilenemeyen bir kaynak olarak modelledi. Eğri stilize bir lojistiktir, Hubbert’in kendi eğrisi değil.",
 "Hubbert’s estimate (175 billion barrels)": "Hubbert’in tahmini (175 milyar varil)",
 "Hubbert": "Hubbert",
 "Your resource estimate": "Sizin kaynak tahmininiz",
 "Yours": "Sizinki",
 "million barrels a day": "günde milyon varil",
 "actual peak 1970": "gerçek zirve 1970",
 "Resource (billion barrels)": "Kaynak (milyar varil)",
 "Peak year in the model": "Modelde zirve yılı",
 "Peak production (million barrels a day)": "Zirve üretim (günde milyon varil)",
 "Hubbert’s range: ": "Hubbert’in aralığı: ",
 "The USGS view: ": "USGS’nin görüşü: ",
 "In between: ": "Arada: ",
 "With a resource of {u} billion barrels the model peaks in {y}. ": "{u} milyar varillik kaynakla model {y} yılında zirve yapar. ",
 "Hubbert estimated 150–200 billion barrels in 1956 and forecast the peak for 1966–1971; the actual peak came in 1970 (p. 93).": "Hubbert 1956’da 150–200 milyar varil tahmin etti ve zirveyi 1966–1971 için öngördü; gerçek zirve 1970’te geldi (s. 93).",
 "The USGS projected a resource nearly three times as large and claimed it would not limit production for 10 to 20 years at least. The peak came in 1970 anyway (p. 93).": "USGS neredeyse üç kat büyük bir kaynak öngördü ve bunun en az 10–20 yıl üretimi sınırlamayacağını savundu. Zirve yine de 1970’te geldi (s. 93).",
 "The larger the assumed resource, the later the peak; the structure of a finite resource guarantees a peak, the estimate only sets its date.": "Varsayılan kaynak ne kadar büyükse zirve o kadar geç gelir; sınırlı kaynak yapısı zirveyi garanti eder, tahmin yalnızca tarihini belirler.",
 "Hubbert versus the USGS: structure beats data": "Hubbert ile USGS: yapı veriyi yener",
 "One of the most accurate long-term forecasts on record came from modeling oil explicitly as a nonrenewable resource (p. 93).": "En isabetli uzun vadeli öngörülerden biri, petrolü yenilenemeyen bir kaynak olarak modellemekten geldi (s. 93).",
 "US production under different resource estimates · stylized model": "Farklı kaynak tahminlerinde ABD üretimi · stilize model",
 "Ultimate recoverable resource (billion barrels)": "Nihai çıkarılabilir kaynak (milyar varil)",
 "Hubbert’s 151,000-year chart, from the agricultural revolution to 5,000 years ahead, shows the fossil fuel era as a transitory spike; critics called it Hubbert’s pimple. Sobering, but too long a horizon for decisions about prices, regulation and R&D (p. 94).": "Hubbert’in tarım devriminden 5.000 yıl sonrasına uzanan 151.000 yıllık grafiği fosil yakıt çağını geçici bir sivri uç olarak gösterir; eleştirmenler ona Hubbert’in sivilcesi dedi. Sarsıcı, ama fiyat, düzenleme ve Ar-Ge kararları için fazla uzun bir ufuk (s. 94).",
 "The Sahel": "Sahel",
 "First run the model to 2000 with both policies on: the herd grows, income rises, the policy looks like a success. Then extend the horizon to 2035: the herd collapses below its starting level. Switch the policies off one at a time to show how they interact. Stylized teaching model, inspired by the case on p. 94.": "Önce iki politika açıkken modeli 2000’e kadar koşturun: sürü büyür, gelir artar, politika başarılı görünür. Sonra ufku 2035’e uzatın: sürü başlangıç düzeyinin altına çöker. Politikaları teker teker kapatarak nasıl etkileştiklerini gösterin. s. 94’teki vakadan esinlenen stilize öğretim modeli.",

 "Run to 2035: ": "2035’e kadar koşu: ",
 "the herd peaks in {y} and then collapses to {c} by 2035, below its 1970 level, because the enlarged herd degrades the grassland with a long delay. The same policies now look harmful (p. 94).": "sürü {y} yılında zirve yapıyor ve 2035’te 1970 düzeyinin altına, {c} değerine çöküyor, çünkü büyüyen sürü merayı uzun bir gecikmeyle bozuyor. Aynı politikalar şimdi zararlı görünüyor (s. 94).",
 "The Sahel: policies that look good until the year 2000": "Sahel: 2000 yılına kadar iyi görünen politikalar",
 "Selecting a horizon too short to capture the feedbacks favored policies counter to the region’s long-term interests (p. 94).": "Geri beslemeleri yakalamayacak kadar kısa bir ufuk, bölgenin uzun vadeli çıkarlarına aykırı politikaları kolaylaştırdı (s. 94).",

 "Dynamic hypothesis": "Dinamik hipotez",
 "Define the dynamic hypothesis, then the endogenous test: for each explanation ask the class whether it explains the behavior from inside the boundary or only moves the question outside. In the second tab discuss the modeler’s role as facilitator when every team member has a different theory.": "Dinamik hipotezi tanımlayın, sonra içsellik testi: her açıklama için sınıfa davranışı sınırın içinden mi açıkladığını yoksa soruyu dışarı mı taşıdığını sorun. İkinci sekmede her ekip üyesinin farklı teorisi olduğunda modelcinin kolaylaştırıcı rolünü tartışın.",
 "The dynamic hypothesis and endogenous explanation": "Dinamik hipotez ve içsel açıklama",
 "A working theory of how the problem arose, in terms of feedback structure; always provisional (pp. 94–95).": "Problemin nasıl ortaya çıktığına dair, geri besleme yapısıyla kurulmuş çalışma teorisi; her zaman geçici (s. 94–95).",
 "Endogenous or not?": "İçsel mi, değil mi?",
 "“Sales fell because market demand fell.”": "“Satışlar düştü, çünkü piyasa talebi düştü.”",
 "No: demand is taken as given; what made it fall? The explanation begs the question (p. 95).": "Hayır: talep veri kabul ediliyor; onu ne düşürdü? Açıklama soruyu erteliyor (s. 95).",
 "Correct: exogenous; it moves the question outside the boundary.": "Doğru: dışsal; soruyu sınırın dışına taşıyor.",
 "“Delivery delays grew, customers left, sales fell, so we cut capacity, and delays grew further.”": "“Teslimat gecikmeleri büyüdü, müşteriler gitti, satışlar düştü, biz de kapasiteyi kıstık ve gecikmeler daha da büyüdü.”",
 "Correct: the behavior arises from the interaction of variables inside the model (p. 95).": "Doğru: davranış modelin içindeki değişkenlerin etkileşiminden doğuyor (s. 95).",
 "No: this is a loop inside the boundary, an endogenous explanation.": "Hayır: bu sınırın içinde bir döngü, içsel bir açıklama.",
 "“The herd collapsed because of the drought.”": "“Sürü kuraklık yüzünden çöktü.”",
 "No: the drought is exogenous; the model also needs the overgrazing that made the land vulnerable.": "Hayır: kuraklık dışsal; modelin toprağı kırılgan yapan aşırı otlatmaya da ihtiyacı var.",
 "Correct: exogenous. A drought may trigger the collapse; why the land could not cope lies inside.": "Doğru: dışsal. Kuraklık çöküşü tetikleyebilir; toprağın neden dayanamadığı ise içeridedir.",
 "Which explanations are endogenous?": "Hangi açıklamalar içsel?",

 "Dynamic: ": "Dinamik: ",
 "it explains the dynamics in terms of the underlying feedback and stock-and-flow structure. ": "dinamikleri altta yatan geri besleme ve stok-akış yapısıyla açıklar. ",
 "Hypothesis: ": "Hipotez: ",
 "it is always provisional, subject to revision or abandonment as you learn (p. 95).": "her zaman geçicidir; öğrendikçe gözden geçirilir ya da terk edilir (s. 95).",
 "Exogenous inputs should be few. ": "Dışsal girdiler az olmalı. ",
 "Each candidate must be scrutinized for feedbacks from the endogenous elements; if there are important feedbacks, the boundary must be expanded (pp. 95–96).": "Her aday, içsel öğelerden gelen geri beslemeler açısından incelenmeli; önemli geri beslemeler varsa sınır genişletilmelidir (s. 95–96).",
 "Facilitating the team": "Ekibi kolaylaştırmak",
 "Every member has a different theory": "Her üyenin farklı bir teorisi var",
 "Discussion of the problem and theories about its causes are jumbled together in conversation with client teams. The problem has often persisted for years and generated animosity; everyone advocates their own position and derides the others (p. 95).": "Müşteri ekipleriyle konuşurken problemin tartışması ile nedenlerine ilişkin teoriler iç içe geçer. Problem çoğu zaman yıllardır sürmüş ve husumet yaratmıştır; herkes kendi konumunu savunur, ötekileri küçümser (s. 95).",
 "Capture, don’t filter: ": "Süzmeyin, kaydedin: ",
 "acknowledge and record all the theories without criticizing them.": "bütün teorileri eleştirmeden kabul edin ve kaydedin.",
 "Listen, don’t lecture: ": "Ders vermeyin, dinleyin: ",
 "the modeler’s role in this phase is thoughtful listener, not content expert; clarifying questions help.": "bu aşamada modelcinin rolü içerik uzmanı değil, dikkatli dinleyicidir; açıklayıcı sorular işe yarar.",
 "Aim for endogenous: ": "İçsel olanı hedefleyin: ",
 "help the team turn its stories into a structure that produces the behavior from inside.": "ekibin hikâyelerini davranışı içeriden üreten bir yapıya çevirmesine yardım edin.",
 "A variety of elicitation techniques and diagramming tools support this conversation; the group model building literature (Vennix, 1996; Morecroft and Sterman, 1994) describes them (p. 95, note 9).": "Çeşitli bilgi toplama teknikleri ve diyagram araçları bu konuşmayı destekler; grup model kurma yazını (Vennix, 1996; Morecroft ve Sterman, 1994) bunları anlatır (s. 95, not 9).",
 "Much of the rest of the modeling process is a test of the dynamic hypothesis, with the simulation model and with data collection in the real world (p. 95).": "Modelleme sürecinin geri kalanının çoğu, dinamik hipotezin simülasyon modeliyle ve gerçek dünyada veri toplayarak sınanmasıdır (s. 95).",
 "PIES": "PIES",
 "Toggle the economy between exogenous and endogenous. With an exogenous economy the course model, like PIES, projects low imports because growth stays high and domestic supply arrives as planned. With the loops closed, growth slows, new supply stalls and imports stay high, as they did in reality. Stylized model; the numbers in the book are on the right.": "Ekonomiyi dışsal ile içsel arasında değiştirin. Dışsal ekonomiyle ders modeli, PIES gibi, düşük ithalat öngörür, çünkü büyüme yüksek kalır ve yerli arz planlandığı gibi gelir. Döngüler kapanınca büyüme yavaşlar, yeni arz tıkanır ve ithalat gerçekte olduğu gibi yüksek kalır. Stilize model; kitaptaki sayılar sağda.",
 "Imports, exogenous economy (PIES-like)": "İthalat, dışsal ekonomi (PIES benzeri)",
 "Imports, endogenous economy": "İthalat, içsel ekonomi",
 "PIES 1985 projection: 3.3": "PIES’in 1985 öngörüsü: 3,3",
 "actual, late 1980s: 5.5": "gerçek, 1980’lerin sonu: 5,5",

 "Import share in 1995": "1995’te ithalat payı",
 "New domestic supply by 1985": "1985’e kadar yeni yerli arz",
 "Endogenous economy: ": "İçsel ekonomi: ",

 "the 1979 price shock and the capital absorbed by energy investment slow growth; demand responds to price; new supply is built only while prices stay high. Imports stay at {i} in 1985 and reach {s} of consumption by 1995.": "1979 fiyat şoku ve enerji yatırımının çektiği sermaye büyümeyi yavaşlatır; talep fiyata tepki verir; yeni arz ancak fiyatlar yüksek kaldıkça kurulur. İthalat 1985’te {i} düzeyinde kalır ve 1995’te tüketimin {s} oranına ulaşır.",
 "growth continues regardless of energy prices and new supply arrives as planned, so imports fall to {i} by 1985. This is the structure that made PIES overoptimistic (p. 96).": "büyüme enerji fiyatlarından bağımsız sürer ve yeni arz planlandığı gibi gelir; ithalat 1985’te {i} düzeyine düşer. PIES’i aşırı iyimser yapan yapı budur (s. 96).",
 "PIES: when the economy is exogenous": "PIES: ekonomi dışsal olunca",
 "Treating the economy exogenously made the model inherently contradictory and consistently overoptimistic (p. 96).": "Ekonomiyi dışsal almak modeli özünde çelişkili ve sürekli aşırı iyimser yaptı (s. 96).",
 "US oil imports under two model boundaries · stylized model": "İki model sınırında ABD petrol ithalatı · stilize model",
 "Economy exogenous": "Ekonomi dışsal",
 "Economy endogenous": "Ekonomi içsel",
 "Model boundary": "Model sınırı",
 "The book’s numbers. ": "Kitaptaki sayılar. ",
 "In 1974 PIES projected 1985 imports of 3.3 million barrels a day, shale oil at 250,000 barrels a day and oil at $22 (1984 dollars). Actual imports in the late 1980s were about 5.5 million barrels a day and more than half of consumption by the mid-1990s; synfuels never materialized (p. 96).": "1974’te PIES 1985 için günde 3,3 milyon varil ithalat, günde 250.000 varil şeyl petrolü ve 22 dolar (1984 doları) petrol fiyatı öngördü. 1980’lerin sonunda gerçek ithalat günde yaklaşık 5,5 milyon varildi ve 1990’ların ortasında tüketimin yarısını aştı; sentetik yakıtlar hiç gerçekleşmedi (s. 96).",
 "Boundary chart": "Sınır tablosu",
 "Click the variables in the three columns; the notes explain why each sits where it does (Table 3-2, Sterman 1983). Ask the class which exogenous variable is most questionable: the world oil price, because US imports feed back on it. Close with why such charts are rare.": "Üç sütundaki değişkenlere tıklayın; notlar her birinin neden orada olduğunu açıklar (Tablo 3-2, Sterman 1983). Sınıfa en tartışmalı dışsal değişkeni sorun: dünya petrol fiyatı, çünkü ABD ithalatı ona geri döner. Bu tabloların neden nadir olduğuyla kapatın.",
 "Click a variable.": "Bir değişkene tıklayın.",
 "Generated inside the model from the interaction of the other variables.": "Modelin içinde, öteki değişkenlerin etkileşiminden üretilir.",
 "Taken as given; the model does not change it.": "Veri kabul edilir; model onu değiştirmez.",
 "Deliberately left out of the model.": "Bilinçli olarak modelin dışında bırakılmıştır.",
 "The model boundary chart (Table 3-2)": "Model sınır tablosu (Tablo 3-2)",
 "Lists which key variables are endogenous, exogenous and excluded: surprisingly useful and shockingly rare (pp. 97–98).": "Hangi değişkenlerin içsel, dışsal ve dışarıda olduğunu listeler: çok yararlı, şaşırtıcı derecede nadir (s. 97–98).",
 "Excluded": "Dışarıda",
 "Why so rare? ": "Neden bu kadar nadir? ",
 "Models are often weapons in a war of advocacy, so modelers hide their assumptions; even benign modelers feel uncomfortable listing what they left out. Yet the list is a visible reminder of the caveats, and without it models built for one purpose are used for another, sometimes producing absurd results (pp. 98–99).": "Modeller çoğu zaman bir savunu savaşında silahtır; bu yüzden modelciler varsayımlarını saklar; iyi niyetli modelciler bile dışarıda bıraktıklarını listelemekten rahatsız olur. Oysa liste bu varsayımların görünür bir hatırlatıcısıdır; o olmayınca bir amaç için kurulan modeller başka amaçla kullanılır ve bazen saçma sonuçlar üretir (s. 98–99).",
 "Workshop: build one →": "Atölye: bir tane kurun →",
 "Subsystem diagrams": "Alt sistem diyagramları",
 "Show the four growth patterns (Figure 3-6): which does the class think is most common? Forrester says D, growth with repeated crises. Then the two subsystems, company and market, coupled by orders, product, payment and signals. The fact to land: two years of false starts to define the boundary, eight weeks for 200 equations.": "Dört büyüme örüntüsünü gösterin (Şekil 3-6): sınıf hangisinin en yaygın olduğunu düşünüyor? Forrester D diyor: tekrarlayan krizlerle büyüme. Sonra iki alt sistem, şirket ve pazar; siparişler, ürün, ödeme ve sinyallerle bağlı. Yerleşmesi gereken olgu: sınırı tanımlamak için iki yıllık yanlış başlangıç, 200 denklem için sekiz hafta.",
 "Subsystem diagrams and Forrester’s corporate growth model": "Alt sistem diyagramları ve Forrester’ın kurumsal büyüme modeli",
 "A subsystem diagram shows the overall architecture: the subsystems and the flows coupling them (pp. 99–101).": "Alt sistem diyagramı genel mimariyi gösterir: alt sistemler ve onları bağlayan akışlar (s. 99–101).",
 "Four growth patterns": "Dört büyüme örüntüsü",
 "A · Smooth growth to a plateau": "A · Platoya düzgün büyüme",
 "The very rare company grows smoothly and reaches a healthy sustained plateau of mature life.": "Çok nadir şirket düzgün büyür ve olgunluk döneminde sağlıklı, kalıcı bir platoya ulaşır.",
 "B · Early success, then crisis": "B · Erken başarı, sonra kriz",
 "More frequently, the company appears to succeed at first and then meets a severe crisis that leads to bankruptcy or merger.": "Daha sık görülen, şirketin önce başarılı görünüp sonra iflasa ya da birleşmeye götüren ağır bir krizle karşılaşmasıdır.",
 "C · Stagnation": "C · Durgunluk",
 "Often the pattern is growth stagnation, marked by neither success nor failure.": "Örüntü çoğu zaman ne başarı ne başarısızlıkla belirlenen büyüme durgunluğudur.",
 "D · Growth with repeated crises": "D · Tekrarlayan krizlerle büyüme",
 "Among companies with a long-term growth trend, the most common pattern is growth accompanied by repeated crisis (Forrester, 1964, pp. 32–33).": "Uzun vadeli büyüme eğilimi gösteren şirketlerde en yaygın örüntü, tekrarlayan krizlerin eşlik ettiği büyümedir (Forrester, 1964, s. 32–33).",
 "time": "zaman",

 "The two subsystems are coupled by orders, product and money, but also by signals: price, availability measured by the delivery delay, quality and suitability. The market responds through the order rate and customer feedback. The diagram stresses that orders depend on much more than price (p. 100).": "İki alt sistem siparişler, ürün ve parayla, ama aynı zamanda sinyallerle bağlıdır: fiyat, teslimat gecikmesiyle ölçülen bulunabilirlik, kalite ve uygunluk. Pazar sipariş hızı ve müşteri geri bildirimiyle tepki verir. Diyagram siparişlerin fiyattan çok daha fazlasına bağlı olduğunu vurgular (s. 100).",
 "2 years → 8 weeks": "2 yıl → 8 hafta",
 "Part-time false starts before the boundary was defined; then the entire 200-equation model (p. 100)": "Sınır tanımlanana kadar yarı zamanlı yanlış başlangıçlar; sonra 200 denklemlik modelin tamamı (s. 100)",
 "Defining the system boundary and the degree of aggregation are two of the most difficult steps in successful modeling (Forrester, quoted on p. 100). The semiconductor model of Figure 3-8 shows a more detailed architecture, including a “financial stress” sector that is not an organizational unit (p. 101).": "Sistem sınırını ve toplulaştırma derecesini tanımlamak başarılı modellemenin en zor iki adımıdır (Forrester, aktaran s. 100). Şekil 3-8’deki yarı iletken modeli, organizasyon birimi olmayan bir “mali baskı” sektörü de içeren daha ayrıntılı bir mimari gösterir (s. 101).",
 "Mapping tools": "Haritalama araçları",
 "Boundary charts show scope; these maps show how variables are related. Use the Sahel diagram: highlight each loop and tell the story. Then the three tools: causal loop diagrams for feedback, stock-and-flow maps for physical structure, policy structure diagrams for one decision rule.": "Sınır tabloları kapsamı gösterir; bu haritalar değişkenlerin ilişkisini gösterir. Sahel diyagramını kullanın: her döngüyü vurgulayıp hikâyeyi anlatın. Sonra üç araç: geri besleme için nedensel döngü diyagramları, fiziksel yapı için stok-akış haritaları, tek bir karar kuralı için politika yapı diyagramları.",
 "Sahel causal loop diagram": "Sahel nedensel döngü diyagramı",
 "Arrows from cause to effect, loops marked reinforcing or balancing: the feedback structure in any domain (chapter 5).": "Nedenden sonuca oklar, pekiştiren ya da dengeleyen diye işaretlenmiş döngüler: her alanda geri besleme yapısı (bölüm 5).",
 "Stock-and-flow map": "Stok-akış haritası",

 "Policy structure diagram": "Politika yapı diyagramı",
 "The information inputs and delays of one decision rule, rather than the feedback structure of the whole system (Morecroft, 1982; chapter 15).": "Bütün sistemin geri besleme yapısı yerine tek bir karar kuralının bilgi girdileri ve gecikmeleri (Morecroft, 1982; bölüm 15).",
 "Mapping system structure": "Sistem yapısını haritalamak",
 "Boundary charts show the scope of the model; causal diagrams show how the variables are related (p. 102).": "Sınır tabloları modelin kapsamını gösterir; nedensel diyagramlar değişkenlerin ilişkisini gösterir (s. 102).",
 "The Sahel dynamic hypothesis as a causal loop diagram": "Nedensel döngü diyagramı olarak Sahel dinamik hipotezi",
 "Maps are hypotheses, not tests. ": "Haritalar hipotezdir, test değil. ",

 "Workshop: solve the polarities →": "Atölye: polariteleri çözün →",
 "Formulation and testing": "Formülasyon ve test",

 "Even though these conditions have never and could never be observed, there is no doubt what the behavior of the system must be. You might imagine that models would never fail such obvious tests. You would be wrong: many widely used models in economics, psychology and management violate basic laws of physics, even though they replicate historical behavior quite well (p. 103).": "Bu koşullar hiç gözlenmemiş ve gözlenemeyecek olsa da sistemin nasıl davranması gerektiğine dair kuşku yoktur. Modellerin bu kadar açık testlerde asla başarısız olmayacağını düşünebilirsiniz. Yanılırsınız: ekonomide, psikolojide ve yönetimde yaygın kullanılan birçok model tarihsel davranışı oldukça iyi yeniden üretse de temel fizik yasalarını çiğner (s. 103).",

 "Click the five levers from low to high leverage. Then the Sahel combination test: each policy alone, then both together; the herd at the horizon shows that the impacts do not add up. Close by sending students to the project simulator.": "Beş kaldıraca düşükten yükseğe tıklayın. Sonra Sahel birleşim testi: her politika tek başına, sonra ikisi birlikte; ufuktaki sürü etkilerin toplanmadığını gösterir. Öğrencileri proje simülatörüne göndererek kapatın.",

 "You are a patient teaching assistant for a university course on system dynamics. The lesson: Chapter 3 of Sterman’s (2000) Business Dynamics, “The Modeling Process”. Covered topics: managers as designers, the client, modeling a problem rather than a system, reference modes, time horizon, dynamic hypothesis, endogenous explanation, model boundary charts, subsystem diagrams, causal loop and stock-and-flow maps, formulation, extreme condition tests, policy design and iteration. Examples: US oil over 10, 130 and 151,000 years, Hubbert’s forecast, the Sahel model, PIES, Forrester’s corporate growth model.\nThe concept the student remembers most: {c}.\nThe point the student still finds unclear: “{q}”\nTask: Explain this point in English, warmly and conversationally, in at most 150 words. Give an everyday example and connect it to the related example or concept from the lesson. End with one short question the student can use to test themselves. Do not use headings, bullet points or markdown.": "Sistem dinamiği üzerine bir üniversite dersinde sabırlı bir öğretim asistanısın. Ders: Sterman’ın (2000) Business Dynamics kitabının 3. bölümü, “Modelleme Süreci”. İşlenen konular: tasarımcı olarak yöneticiler, müşteri, sistemi değil problemi modellemek, referans modları, zaman ufku, dinamik hipotez, içsel açıklama, model sınır tabloları, alt sistem diyagramları, nedensel döngü ve stok-akış haritaları, formülasyon, aşırı koşul testleri, politika tasarımı ve yineleme. Örnekler: 10, 130 ve 151.000 yılda ABD petrolü, Hubbert’in öngörüsü, Sahel modeli, PIES, Forrester’ın kurumsal büyüme modeli.\nÖğrencinin en çok hatırladığı kavram: {c}.\nÖğrencinin hâlâ belirsiz bulduğu nokta: “{q}”\nGörev: Bu noktayı Türkçe, sıcak ve konuşma diliyle, en fazla 150 sözcükle açıkla. Günlük hayattan bir örnek ver ve dersteki ilgili örneğe ya da kavrama bağla. Öğrencinin kendini sınayabileceği kısa bir soruyla bitir. Başlık, madde işareti ya da markdown kullanma.",
 "Model a problem, never a system; the purpose is the knife. The client is whoever must change. Modeling is iterative, and the modeler’s integrity is part of the method.": "Sistemi değil problemi modelleyin; amaç bıçaktır. Müşteri, değişmesi gereken kişidir. Modelleme yinelemelidir ve modelcinin dürüstlüğü yöntemin parçasıdır.",
 "Draw the reference mode and set the horizon from the longest delays before writing an equation.": "Denklem yazmadan önce referans modunu çizin ve ufku en uzun gecikmelerden belirleyin.",
 "Seek endogenous explanations and write down what the model leaves out.": "İçsel açıklamalar arayın ve modelin dışarıda bıraktıklarını yazın.",
 "Test to the extremes; design policies that change the loops, not just the parameters.": "Uçlara kadar sınayın; yalnızca parametreleri değil döngüleri değiştiren politikalar tasarlayın.",
 "1986–1996: production drifts slowly down, consumption slowly up, imports grow modestly; prices stay between $14 and $23 a barrel. The system looks stable, with little evidence of a long-term problem (p. 91).": "1986–1996: üretim yavaşça düşüyor, tüketim yavaşça artıyor, ithalat ılımlı büyüyor; fiyatlar varil başına 14–23 dolar arasında kalıyor. Sistem istikrarlı görünüyor; uzun vadeli bir problemin pek belirtisi yok (s. 91).",
 "1870–1996: consumption grew about 4.3% a year from 1920 to 1973; production peaked in 1970 and has fallen since, to 54% of its peak in the lower 48 states by 1996; imports reached 61% of consumption. The problem was not solved in the 1980s; it has been getting worse (p. 92).": "1870–1996: tüketim 1920’den 1973’e yılda yaklaşık %4,3 büyüdü; üretim 1970’te zirve yaptı ve o günden beri düşüyor; 48 eyalet üretimi 1996’da zirvenin %54’üne indi; ithalat tüketimin %61’ine ulaştı. Problem 1980’lerde çözülmedi; kötüleşiyor (s. 92).",
 "10,000 years ago to 5,000 years ahead: the fossil fuel era is a transitory spike, a unique period of living off a one-time inheritance of natural capital. Sobering, but too long a horizon to guide decisions on prices, regulation and R&D (p. 94).": "10.000 yıl önceden 5.000 yıl sonrasına: fosil yakıt çağı geçici bir sivri uç, doğal sermayenin bir kerelik mirasıyla yaşanan eşsiz bir dönem. Sarsıcı, ama fiyat, düzenleme ve Ar-Ge kararlarına yön veremeyecek kadar uzun bir ufuk (s. 94).",

/* ===== MODELLER: Modelleme süreci (Sterman, Bölüm 3) · stilize öğretim modelleri ===== */
const SD = (() => {
  const rng = seed => { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; };
  const gauss = r => { const u = Math.max(1e-9, r()), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

  /* Petrol yaşam döngüsü (Hubbert tipi lojistik, birim: yıl). urr = nihai çıkarılabilir kaynak (milyar varil).
     k erken büyüme hızı; t0 lojistik orta noktası urr=175 için 1970'e ayarlanır; aynı erken eğriyi koruyan daha büyük urr zirveyi geciktirir. */
  const oilDefaults = { urr: 175, k: .062, y0: 1870, y1: 2050, peakRef: 1970, urrRef: 175 };
  function oil(o = {}) {
    const p = Object.assign({}, oilDefaults, o);
    const t0 = p.peakRef + Math.log(p.urr / p.urrRef) / p.k;
    const out = { t: [], q: [], cum: [], p };
    let peak = -1, peakY = null;
    for (let y = p.y0; y <= p.y1; y++) {
      const Q = p.urr / (1 + Math.exp(-p.k * (y - t0))), q = p.k * Q * (1 - Q / p.urr) * 1000 / 365;
      out.t.push(y); out.q.push(q); out.cum.push(Q);
      if (q > peak) { peak = q; peakY = y; }
    }
    out.peakYear = peakY; out.peak = peak; out.t0 = t0;
    return out;
  }

  /* ABD petrol sistemi için şematik seriler (milyon varil/gün): 1870–1996 kitaptaki Şekil 3-4 ile tutarlı biçimde çizilir. Veri değil, çizim. */
  function oilSketch() {
    const prod = [], cons = [], imp = [];
    for (let y = 1870; y <= 1996; y++) {
      let pr, co;
      if (y < 1920) { pr = .01 * Math.exp(.09 * (y - 1870)); co = pr; }
      else if (y <= 1970) { co = 1.2 * Math.exp(.043 * (y - 1920)); pr = y < 1950 ? co : co * (1 - .18 * (y - 1950) / 20); }
      else { pr = 9.6 * (1 - .46 * Math.min(1, (y - 1970) / 26)); co = y <= 1978 ? 14.7 + (y - 1970) * .4 : y <= 1983 ? 18 - (y - 1978) * .7 : 15 + (y - 1983) * .22; }
      if (y >= 1977 && y <= 1988) pr += Math.min(2, (y - 1977) * .4) * (y <= 1988 ? 1 : 0);
      if (y > 1988) pr += 2 - (y - 1988) * .12;
      prod.push([y, pr]); cons.push([y, co]); imp.push([y, Math.max(0, co - pr)]);
    }
    return { prod, cons, imp };
  }

  /* Sahel: sığır sürüsü ve mera (birim: yıl, 1970 başlangıç). Politika 1975'te başlar ve 15 yılda tam etkiye ulaşır: sondaj kuyuları su kapasitesini, sübvansiyon sürü büyümesini artırır.
     Mera aşırı otlatmayla bozulur; bozulan mera yavaş yenilenir (uzun gecikme). Taşıma kapasitesi çökünce sürü de çöker. Stilize öğretim modeli. */
  const sahelDefaults = { water: 1, subsidy: 1, years: 70, y0: 1970 };
  function sahel(o = {}) {
    const p = Object.assign({}, sahelDefaults, o), dt = .1;
    let C = 100, G = 100;
    const out = { t: [], c: [], g: [], p };
    for (let k = 0; k <= p.years / dt; k++) {
      const t = k * dt;
      if (k % 10 === 0) { out.t.push(p.y0 + Math.round(t)); out.c.push(C); out.g.push(G); }
      const policy = Math.max(0, Math.min(1, (t - 5) / 15));
      const waterCap = 100 * (1 + 1.3 * p.water * policy), grassCap = 1.8 * G;
      const cap = Math.max(5, Math.min(waterCap, grassCap)), birth = .08 * (1 + .5 * p.subsidy * policy);
      const dC = birth * C * (1 - C / cap);
      const stress = Math.max(0, C / (1.1 * G) - 1);
      const dG = .02 * (100 - G) * (G / 100) - 4 * stress * (G / 100);
      C = Math.max(1, C + dt * dC); G = Math.max(3, Math.min(100, G + dt * dG));
    }
    const at = (a, y) => a[Math.max(0, Math.min(a.length - 1, y - p.y0))];
    const cMax = Math.max(...out.c);
    out.m = { c2000: at(out.c, 2000), c2020: at(out.c, 2020), c2035: at(out.c, 2035), g2000: at(out.g, 2000), g2035: at(out.g, 2035), cMax, gMin: Math.min(...out.g), peakYear: out.t[out.c.indexOf(cMax)] };
    return out;
  }

  /* Enerji–ekonomi (PIES benzeri, birim: yıl, 1974 başlangıç; milyon varil/gün). Dışsal ekonomi: büyüme ve yoğunluk eğilimi sabit, enerji yatırımı ekonomiyi etkilemez,
     yeni yerli arz (sentetik yakıt, kömür, nükleer) planlandığı gibi gelir. İçsel ekonomi: 1979 fiyat şoku ve dev enerji yatırımı büyümeyi düşürür, talep fiyata tepki verir,
     yeni arz ancak fiyat yüksek kaldıkça ve sermaye bulundukça kurulur. Stilize öğretim modeli. */
  const energyDefaults = { endogenous: true, growth: .04, elasticity: 1, years: 22, y0: 1974 };
  function energy(o = {}) {
    const p = Object.assign({}, energyDefaults, o), dt = .25;
    let gdp = 100, intensity = .167, dom = 10.5, nw = 0, price = 1;
    const out = { t: [], imp: [], dem: [], dom: [], nw: [], gdp: [], price: [], p };
    for (let k = 0; k <= p.years / dt; k++) {
      const t = k * dt, y = p.y0 + t;
      const demand = gdp * intensity, imp = Math.max(0, demand - dom - nw);
      if (k % 4 === 0) { out.t.push(Math.round(y)); out.imp.push(imp); out.dem.push(demand); out.dom.push(dom); out.nw.push(nw); out.gdp.push(gdp); out.price.push(price); }
      const shock = y >= 1979 && y < 1986 ? 2.4 : y >= 1986 ? 1.1 : 1;
      price += dt * (shock - price) / 1;
      const plan = 1.0;
      const invest = p.endogenous ? plan * Math.max(0, Math.min(1, (price - 1.2) / 1.5)) * .18 : plan;
      const g = p.endogenous ? p.growth - .012 * (price - 1) - .015 * plan * (price > 1.2 ? 1 : .5) : p.growth;
      gdp += dt * g * gdp;
      intensity += dt * intensity * (-.01 - (p.endogenous ? .012 * p.elasticity * (price - 1) : 0));
      dom += dt * (-.015 * dom);
      nw += dt * invest;

/* --- sütun grafik --- */
function colChart(root, cats, vals, o = {}) { return watch(root, () => drawCol(root, cats, vals, o)); }
function drawCol(root, cats, vals, o) {
  const W = o.w || root.clientWidth; root._w = W; root.textContent = '';
  if (!W) return;
  const H = o.h || 200, pl = o.padL ?? 36, pr = 8, pt = 18, pb = o.padB ?? 30;
  const mx = o.yMax || Math.max(1, ...vals), iw = W - pl - pr, ih = H - pt - pb, bw = iw / cats.length;
  const svg = S('svg', { class: 'chart', width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': o.aria || $t('bar chart') });
  for (const v of ticks(0, mx, 4)) { const y = pt + ih - v / mx * ih; svg.append(S('line', { class: 'grid', x1: pl, x2: W - pr, y1: y, y2: y }), S('text', { x: pl - 5, y: y + 4, 'text-anchor': 'end', text: nf(v) + (o.ySuffix || '') })); }
  cats.forEach((c, i) => {
    const v = vals[i], bh = Math.max(0, v / mx * ih), x = pl + i * bw + bw * 0.14, w = bw * 0.72;
    const col = typeof o.color === 'function' ? o.color(i, c, v) : (o.color || 'var(--navy)');
    const r = S('rect', { x, y: pt + ih - bh, width: Math.max(1, w), height: bh, rx: 2, style: `fill:${col}` });
    r.addEventListener('pointermove', ev => showTip(ev.clientX, ev.clientY, o.tipHead ? o.tipHead(c) : String(c), [[o.name || $t('Value'), (o.tipFmt || nf)(v), col]]));
    r.addEventListener('pointerleave', hideTip);
    svg.append(r);
    if (o.showVals && v > 0) svg.append(S('text', { x: x + w / 2, y: pt + ih - bh - 4, 'text-anchor': 'middle', class: 'ptlab', text: (o.valFmt || nf)(v), style: `fill:${col}` }));
    if (!o.labEvery || i % o.labEvery === 0) svg.append(S('text', { x: x + w / 2, y: H - pb + 15, 'text-anchor': 'middle', text: o.catFmt ? o.catFmt(c) : String(c) }));
  });
  svg.append(S('line', { class: 'axis', x1: pl, x2: W - pr, y1: pt + ih, y2: pt + ih }));
  if (o.xLabel) svg.append(S('text', { x: pl + iw / 2, y: H - 2, 'text-anchor': 'middle', text: o.xLabel }));
  root.append(svg);
}

// Tek satırlık büyük metni kutusuna sığdırır: taşarsa yazı boyunu küçültür (çeviride uzayan sayı ve etiketler için).
// Kullanım: const fit = fitText(el, 40); metni değiştirdikten sonra fit() çağırın; öğe görünür olunca ya da genişliği değişince kendiliğinden yeniden sığar.
// Öğenin genişliği kutusundan gelmeli (düğmelerde width:100%, white-space:nowrap); kendi içeriğine göre genişleyen öğe hiç taşmaz ve küçülmez.
function fitText(el, min = 32) {
  let lastW = -1;
  const fit = () => { const w = el.clientWidth; if (!w) return; lastW = w; el.style.fontSize = ''; let fs = parseFloat(getComputedStyle(el).fontSize); while (el.scrollWidth > el.clientWidth + 1 && fs > min) { fs -= 2; el.style.fontSize = fs + 'px'; } };
  if (window.ResizeObserver) new ResizeObserver(() => { if (el.clientWidth !== lastW) fit(); }).observe(el);
  return fit;
}

// Üst menüyü sığdırır: dile göre uzayan menü taşarsa adım adım sıkılaştırır (c1 aralıklar, c2 marka yazısı, c3 yazı boyu);
// yine de taşarsa ince bir kaydırma çubuğu görünür (ovf). Açılışta, yazı tipleri yüklenince ve pencere boyutu değişince çağrılır.
function fitMenu() {
  const top = document.querySelector('.top'), m = document.querySelector('.menu'); if (!top || !m) return;
  const L = ['c1', 'c2', 'c3'];
  top.classList.remove(...L, 'ovf');
  for (const c of L) { if (m.scrollWidth <= m.clientWidth + 1) return; top.classList.add(c); }
  if (m.scrollWidth > m.clientWidth + 1) top.classList.add('ovf');
}

// Çizim alanının dışına taşan metinleri yatayda içeri kaydırır (çeviride uzayan işaret ve uç etiketleri kesilmesin diye).
// Döndürülmüş (transform taşıyan) metinlere dokunmaz. Grafik çizildikten, svg sayfaya eklendikten sonra çağrılır.
function keepTextInside(svg, W) {
  svg.querySelectorAll('text').forEach(t => {
    if (t.getAttribute('transform')) return;
    let b; try { b = t.getBBox(); } catch (e) { return; }
    if (!b.width) return;
    const d = b.x < 2 ? 2 - b.x : b.x + b.width > W - 2 ? W - 2 - (b.x + b.width) : 0;
    if (d) t.setAttribute('x', (parseFloat(t.getAttribute('x')) || 0) + d);
  });
}

// Yatay çizgi etiketleri (hlab) uç ya da nokta etiketleriyle çakışırsa önce çizginin öbür ucuna, yine çakışırsa çizginin altına alır.
// Uç etiketleri veriyle birlikte yer değiştirdiği için (ör. oyunun ilk haftası) çakışma çizimden sonra, gerçek ölçülerle denetlenir.
function declutter(svg, W, pl, pr) {
  const box = e => { try { return e.getBBox(); } catch (x) { return null; } };
  const hit = (a, b) => a && b && !(a.x + a.width < b.x || b.x + b.width < a.x || a.y + a.height < b.y || b.y + b.height < a.y);
  const others = [...svg.querySelectorAll('text.endlab, text.ptlab')];
  svg.querySelectorAll('text.hlab').forEach(t => {
    const clash = () => { const b = box(t); return others.some(o => hit(b, box(o))); };
    if (!clash()) return;
    const left = t.getAttribute('text-anchor') !== 'end';
    t.setAttribute('x', left ? W - pr - 4 : pl + 4); t.setAttribute('text-anchor', left ? 'end' : 'start');
    if (clash()) t.setAttribute('y', +t.getAttribute('y') + 19);
  });
}
